name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # Retarget all .csproj files from .NET 4.0 to 4.8
      - name: Retarget projects to .NET Framework 4.8
        run: |
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            # Replace TargetFrameworkVersion
            $newContent = $content -replace '<TargetFrameworkVersion>v4\.0(?:,Profile=Client)?</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
            if ($content -ne $newContent) {
              Set-Content $_.FullName $newContent
              Write-Host "Updated $($_.FullName)"
            }
          }
        shell: pwsh

      - name: Build ScpServer.sln
        run: msbuild ScpServer.sln /p:Configuration=Release /m

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: |
            ScpServer\bin\Release\*.exe
            ScpInstaller\bin\Release\*.exe
            **\bin\Release\*.dll
