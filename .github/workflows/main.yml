name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Install .NET Framework 4.0 targeting pack – required for these projects
      - name: Install .NET Framework 4.0 targeting pack
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.Net.Component.4.0.TargetingPack `
            --quiet --norestart
        shell: pwsh

      - name: Build ScpServer.sln
        run: msbuild ScpServer.sln /p:Configuration=Release /m

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: |
            ScpServer\bin\Release\*.exe
            ScpInstaller\bin\Release\*.exe
            # Also include any DLLs if needed (e.g., ScpControl.dll)
            **\bin\Release\*.dll
