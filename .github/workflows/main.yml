name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # Prepare project files: retarget to .NET 4.8, remove PreBuildEvent
      - name: Prepare project files
        run: |
          $projects = @(
            "ScpControl\ScpControl.csproj",
            "ScpServer\ScpServer.csproj",
            "ScpInstaller\ScpInstaller.csproj"
          )
          foreach ($proj in $projects) {
            $path = Join-Path $env:GITHUB_WORKSPACE $proj
            if (Test-Path $path) {
              $content = Get-Content $path -Raw
              # Retarget to v4.8
              $content = $content -replace '<TargetFrameworkVersion>v4\.0(?:,Profile=Client)?</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
              $content = $content -replace '<TargetFrameworkVersion>v4\.8,Profile=Client</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
              # Remove PreBuildEvent
              $content = $content -replace '(?s)\s*<PreBuildEvent[^>]*>.*?</PreBuildEvent>', ''
              Set-Content $path $content
              Write-Host "Updated $path"
            }
          }
        shell: pwsh

      # Copy required Common files into each project folder
      - name: Copy Common files
        run: |
          $commonInfo = "Common\Properties\Info.cs"
          $commonIco  = "Common\Resources\Scp.ico"
          $targets = @("ScpControl", "ScpServer", "ScpInstaller")
          foreach ($t in $targets) {
            $propDir = Join-Path $t "Properties"
            $resDir  = Join-Path $t "Resources"
            New-Item -ItemType Directory -Force -Path $propDir | Out-Null
            New-Item -ItemType Directory -Force -Path $resDir  | Out-Null
            Copy-Item $commonInfo (Join-Path $propDir "CommonInfo.cs") -Force
            Copy-Item $commonIco  (Join-Path $resDir  "Scp_All.ico")   -Force
          }
        shell: pwsh

      # Build ScpControl (no platform needed – it uses default)
      - name: Build ScpControl
        run: msbuild ScpControl\ScpControl.csproj /p:Configuration=Release

      # Build ScpServer – specify AnyCPU platform
      - name: Build ScpServer
        run: msbuild ScpServer\ScpServer.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      # Build ScpInstaller – specify AnyCPU platform
      - name: Build ScpInstaller
        run: msbuild ScpInstaller\ScpInstaller.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: |
            ScpServer\bin\Release\ScpServer.exe
            ScpInstaller\bin\Release\ScpInstaller.exe
            bin\ScpControl.dll
