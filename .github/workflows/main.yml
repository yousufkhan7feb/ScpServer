name: Build Full SCP Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # 1. Prepare all .csproj files: retarget to .NET 4.8, remove PreBuildEvent
      - name: Prepare project files
        run: |
          $projects = @(
            "ScpControl\ScpControl.csproj",
            "ScpServer\ScpServer.csproj",
            "ScpInstaller\ScpInstaller.csproj",
            "ScpMonitor\ScpMonitor.csproj",
            "ScpPair\ScpPair.csproj",
            "ScpService\ScpService.csproj"
          )
          foreach ($proj in $projects) {
            $path = Join-Path $env:GITHUB_WORKSPACE $proj
            if (Test-Path $path) {
              $content = Get-Content $path -Raw
              $content = $content -replace '<TargetFrameworkVersion[^>]*>.*?</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
              $content = $content -replace '(?s)\s*<PreBuildEvent[^>]*>.*?</PreBuildEvent>', ''
              Set-Content $path $content
            }
          }
        shell: pwsh

      # 2. Copy Common resources into each project
      - name: Copy Common files
        run: |
          $commonInfo = "Common\Properties\Info.cs"
          $commonIco  = "Common\Resources\Scp.ico"
          $targets = @("ScpControl", "ScpServer", "ScpInstaller", "ScpMonitor", "ScpPair", "ScpService")
          foreach ($t in $targets) {
            $propDir = Join-Path $t "Properties"
            $resDir  = Join-Path $t "Resources"
            New-Item -ItemType Directory -Force -Path $propDir | Out-Null
            New-Item -ItemType Directory -Force -Path $resDir  | Out-Null
            Copy-Item $commonInfo (Join-Path $propDir "CommonInfo.cs") -Force
            Copy-Item $commonIco  (Join-Path $resDir  "Scp_All.ico")   -Force
          }
        shell: pwsh

      # 3. Build all C# projects
      - name: Build ScpControl
        run: msbuild ScpControl\ScpControl.csproj /p:Configuration=Release /p:Platform="AnyCPU"
      - name: Build ScpServer
        run: msbuild ScpServer\ScpServer.csproj /p:Configuration=Release /p:Platform="AnyCPU"
      - name: Build ScpInstaller
        run: msbuild ScpInstaller\ScpInstaller.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:TargetFrameworkVersion=v4.8 /p:TargetFrameworkProfile=
      - name: Build ScpMonitor
        run: msbuild ScpMonitor\ScpMonitor.csproj /p:Configuration=Release /p:Platform="AnyCPU"
      - name: Build ScpPair
        run: msbuild ScpPair\ScpPair.csproj /p:Configuration=Release /p:Platform="AnyCPU"
      - name: Build ScpService
        run: msbuild ScpService\ScpService.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      # 4. Create output folder structure
      - name: Create output folders
        run: |
          mkdir output
          mkdir output\System
          mkdir output\DIFxAPI
          mkdir output\Win32
          mkdir output\Win64
          mkdir output\Zadig
        shell: cmd

      # 5. Copy built EXEs, DLLs, and XMLs from the root bin folder
      - name: Copy built files
        run: |
          xcopy /Y ..\bin\*.exe output\
          xcopy /Y ..\bin\*.dll output\
          xcopy /Y ..\bin\*.xml output\
        shell: cmd

      # 6. Copy pre‑built folders from the repository (if they exist)
      - name: Copy pre‑built folders
        run: |
          if exist System xcopy /E /I System output\System\
          if exist DIFxAPI xcopy /E /I DIFxAPI output\DIFxAPI\
          if exist Win32 xcopy /E /I Win32 output\Win32\
          if exist Win64 xcopy /E /I Win64 output\Win64\
          if exist Zadig xcopy /E /I Zadig output\Zadig\
        shell: cmd

      # 7. Upload the complete package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Full-Package
          path: output
