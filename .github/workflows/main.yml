name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: List project files (debug)
        run: |
          dir *.sln /s
          dir *.csproj /s
        shell: cmd

      - name: Build solution (if exists)
        run: |
          for /f "delims=" %%i in ('dir /b /s *.sln') do set SLN=%%i
          if defined SLN (
            echo Building %SLN%
            msbuild %SLN% /p:Configuration=Release /m
          ) else (
            echo No solution found – building each .csproj without platform
            msbuild ScpServer\ScpServer.csproj /p:Configuration=Release
            msbuild ScpInstaller\ScpInstaller.csproj /p:Configuration=Release
          )
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: |
            **/bin/Release/**/*
            **/bin/x64/Release/**/*
