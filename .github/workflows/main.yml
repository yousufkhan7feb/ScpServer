name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # 1. Retarget to .NET 4.8 and remove PreBuildEvent
      - name: Prepare project files
        run: |
          $projects = @(
            "ScpControl\ScpControl.csproj",
            "ScpServer\ScpServer.csproj",
            "ScpInstaller\ScpInstaller.csproj"
          )
          foreach ($proj in $projects) {
            $path = Join-Path $env:GITHUB_WORKSPACE $proj
            if (Test-Path $path) {
              $content = Get-Content $path -Raw
              $content = $content -replace '<TargetFrameworkVersion[^>]*>.*?</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
              $content = $content -replace '(?s)\s*<PreBuildEvent[^>]*>.*?</PreBuildEvent>', ''
              Set-Content $path $content
              Write-Host "Updated $path"
            }
          }
        shell: pwsh

      # 2. Copy required Common files into each project
      - name: Copy Common files
        run: |
          $commonInfo = "Common\Properties\Info.cs"
          $commonIco  = "Common\Resources\Scp.ico"
          $targets = @("ScpControl", "ScpServer", "ScpInstaller")
          foreach ($t in $targets) {
            $propDir = Join-Path $t "Properties"
            $resDir  = Join-Path $t "Resources"
            New-Item -ItemType Directory -Force -Path $propDir | Out-Null
            New-Item -ItemType Directory -Force -Path $resDir  | Out-Null
            Copy-Item $commonInfo (Join-Path $propDir "CommonInfo.cs") -Force
            Copy-Item $commonIco  (Join-Path $resDir  "Scp_All.ico")   -Force
          }
        shell: pwsh

      # 3. Build ScpControl
      - name: Build ScpControl
        run: msbuild ScpControl\ScpControl.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      # 4. Build ScpServer
      - name: Build ScpServer
        run: msbuild ScpServer\ScpServer.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      # 5. Build ScpInstaller (overrides TargetFrameworkProfile)
      - name: Build ScpInstaller
        run: msbuild ScpInstaller\ScpInstaller.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:TargetFrameworkVersion=v4.8 /p:TargetFrameworkProfile=

      # 6. Upload all files from the root bin folder
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: bin\*
