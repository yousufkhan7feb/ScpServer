name: Build ScpServer (Apps only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build GUI and installer
        run: |
          msbuild ScpServer\ScpServer.csproj /p:Configuration=Release /p:Platform="Any CPU"
          msbuild ScpInstaller\ScpInstaller.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Apps
          path: |
            ScpServer\bin\Release\*.exe
            ScpInstaller\bin\Release\*.exe
