name: Build ScpServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # Build only the main solution (not the _2010 ones)
      - name: Build ScpServer.sln
        run: msbuild ScpServer.sln /p:Configuration=Release /m

      - uses: actions/upload-artifact@v4
        with:
          name: ScpServer-Output
          path: |
            ScpServer\bin\Release\*.exe
            ScpInstaller\bin\Release\*.exe
            # Also include any other needed files (like DLLs) if they exist
            **\bin\Release\*.dll
